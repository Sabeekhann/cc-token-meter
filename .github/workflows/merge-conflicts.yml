name: Merge Conflicts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: merge-conflicts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  merge-conflicts:
    name: Merge conflict markers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject unresolved conflict markers
        run: |
          if git grep -nI -E '^(<{7}|>{7}|\|{7})( |$)|^={7}$' -- .; then
            echo "::error::Unresolved Git merge-conflict markers were committed."
            exit 1
          fi
          echo "No unresolved merge-conflict markers found."
