name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  required:
    name: Required CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
          package-manager-cache: true
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Enforce local-only architecture and syntax
        run: npm run check
      - name: Run unit and contract tests
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Verify publishable package contents
        run: npm pack --dry-run
      - name: Smoke-test CLI entry points
        run: |
          node bin/cc-token-meter.js --help
          node bin/cc-token-meter.js --version
          node bin/cc-token-meter.js --summary --no-cache
      - name: Reject unresolved merge-conflict markers
        run: |
          if git grep -nI -E '^(<{7}|>{7}|\|{7})( |$)|^={7}$' -- .; then
            echo "::error::Unresolved Git merge-conflict markers were committed."
            exit 1
          fi
          echo "No unresolved merge-conflict markers found."
