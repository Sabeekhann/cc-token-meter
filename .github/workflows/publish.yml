name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  npm:
    name: npm
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify release tag and package metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node .github/scripts/verify-release.mjs "$RELEASE_TAG"
      - name: Run the full local gate
        run: npm run ci
      - name: Verify publishable package contents
        run: npm pack --dry-run
      - name: Publish public package with trusted provenance
        run: npm publish --access public
