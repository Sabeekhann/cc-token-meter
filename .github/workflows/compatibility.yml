name: Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, ready_for_review, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 20.x
          - os: ubuntu-latest
            node-version: 22.x
          - os: ubuntu-latest
            node-version: 26.x
          - os: macos-latest
            node-version: 24.x
          - os: windows-latest
            node-version: 24.x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          package-manager-cache: true
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run unit and contract tests
        run: npm test
      - name: Exercise packed release lifecycle
        run: npm run test:lifecycle
      - name: Enforce large-history performance budgets
        if: matrix.node-version == '20.x' || matrix.node-version == '24.x' || matrix.node-version == '26.x'
        run: npm run benchmark:large

  gate:
    name: Compatibility gate
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the full compatibility matrix
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "::error::Compatibility matrix result: $MATRIX_RESULT"
            exit 1
          fi
          echo "Compatibility matrix passed."
