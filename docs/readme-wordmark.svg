<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 430" role="img" aria-labelledby="title description">
  <title id="title">CC Token Meter</title>
  <desc id="description">CC Token Meter wordmark. Know where every token goes. Local-only, with no telemetry and no API key.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827" />
      <stop offset="0.55" stop-color="#0b1220" />
      <stop offset="1" stop-color="#101b2b" />
    </linearGradient>
    <linearGradient id="wordmark" x1="190" y1="0" x2="1410" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fb7185" />
      <stop offset="0.18" stop-color="#fda4af" />
      <stop offset="0.3" stop-color="#f8fafc" />
      <stop offset="0.68" stop-color="#f8fafc" />
      <stop offset="0.82" stop-color="#5eead4" />
      <stop offset="1" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="meter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb7185" />
      <stop offset="0.48" stop-color="#fbbf24" />
      <stop offset="1" stop-color="#2dd4bf" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-opacity="0.055" stroke-width="1" />
    </pattern>
    <clipPath id="topSlices">
      <rect x="120" y="112" width="1360" height="21" />
      <rect x="120" y="156" width="1360" height="17" />
      <rect x="120" y="202" width="1360" height="15" />
    </clipPath>
    <clipPath id="bottomSlices">
      <rect x="120" y="132" width="1360" height="24" />
      <rect x="120" y="173" width="1360" height="29" />
      <rect x="120" y="217" width="1360" height="41" />
    </clipPath>
  </defs>

  <rect width="1600" height="430" rx="28" fill="url(#panel)" />
  <rect x="1" y="1" width="1598" height="428" rx="27" fill="none" stroke="#334155" stroke-width="2" />
  <rect x="1" y="1" width="1598" height="428" rx="27" fill="url(#grid)" />

  <g font-family="Arial Black, DejaVu Sans, sans-serif" font-size="134" font-weight="900" letter-spacing="5" text-anchor="middle">
    <text x="803" y="255" fill="none" stroke="#0f172a" stroke-width="14">CC TOKEN METER</text>
    <text x="800" y="252" fill="url(#wordmark)" stroke="#f8fafc" stroke-opacity="0.16" stroke-width="2">CC TOKEN METER</text>

    <text x="806" y="258" fill="none" stroke="#fb7185" stroke-width="3" opacity="0.8" clip-path="url(#topSlices)">CC TOKEN METER</text>
    <text x="794" y="246" fill="none" stroke="#2dd4bf" stroke-width="3" opacity="0.8" clip-path="url(#bottomSlices)">CC TOKEN METER</text>
  </g>

  <g fill="#0b1220">
    <rect x="126" y="143" width="1348" height="5" />
    <rect x="126" y="183" width="1348" height="4" />
    <rect x="126" y="224" width="1348" height="5" />
  </g>

  <g opacity="0.9">
    <rect x="126" y="91" width="96" height="8" rx="4" fill="#fb7185" />
    <rect x="230" y="91" width="44" height="8" rx="4" fill="#fbbf24" />
    <rect x="282" y="91" width="18" height="8" rx="4" fill="#2dd4bf" />
    <text x="1474" y="99" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" letter-spacing="3" text-anchor="end">TOKEN INTELLIGENCE / LOCAL</text>
  </g>

  <rect x="126" y="291" width="1348" height="8" rx="4" fill="#1e293b" />
  <rect x="126" y="291" width="1348" height="8" rx="4" fill="url(#meter)" opacity="0.95" />
  <g fill="#0b1220">
    <rect x="328" y="288" width="8" height="14" />
    <rect x="572" y="288" width="8" height="14" />
    <rect x="814" y="288" width="8" height="14" />
    <rect x="1058" y="288" width="8" height="14" />
    <rect x="1300" y="288" width="8" height="14" />
  </g>

  <text x="800" y="352" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="28" font-weight="700" letter-spacing="4" text-anchor="middle">KNOW WHERE EVERY TOKEN GOES</text>
  <text x="800" y="391" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" letter-spacing="3" text-anchor="middle">LOCAL-ONLY  ·  NO TELEMETRY  ·  NO API KEY</text>
</svg>
