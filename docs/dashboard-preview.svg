<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code Token Meter dashboard overview</title>
  <desc id="desc">Synthetic preview showing tokens, estimated cost, cache reuse, active sessions, burn history, forecast, projects, and recommendations.</desc>
  <defs>
    <linearGradient id="navGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18233d" />
      <stop offset="0.55" stop-color="#0c1220" />
      <stop offset="1" stop-color="#090e19" />
    </linearGradient>
    <linearGradient id="coralCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8f5" />
      <stop offset="1" stop-color="#ffffff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="13" flood-color="#0c1220" flood-opacity="0.07" />
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .caps { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; fill: #919bad; }
      .muted { fill: #657087; }
      .navText { fill: #8f9ab0; font-size: 14px; font-weight: 600; }
      .label { fill: #657087; font-size: 13px; font-weight: 600; }
      .value { fill: #0c1220; font-size: 32px; font-weight: 760; }
      .small { fill: #657087; font-size: 12px; }
      .panelTitle { fill: #182033; font-size: 17px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1440" height="900" rx="22" fill="#f4f6f9" />
  <rect width="248" height="900" rx="22" fill="url(#navGlow)" />
  <rect x="226" width="22" height="900" fill="#0c1220" />

